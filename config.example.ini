# MFP Print & Scan Server settings.
# On first start this file is copied to config.ini — edit config.ini, not this
# file (config.ini isn't committed to git, it may hold passwords).
# Restart the server after changes. Environment variables (MFP_PORT, MFP_LANG,
# ...) override values from this file.

# Interface language until a user picks one with the RU / EN switch
# (their choice is remembered in the browser): en | ru |
# auto = the browser's language, else the OS language
defaultlang = en

# Ports: web interface / API, and the IPP printer (Windows only; 0 = off)
port = 8000
ipp_port = 631

# Printer the IPP endpoint prints to; empty = the OS default printer
ipp_printer =

# Advertise the IPP printer and/or the eSCL scanner (below) via Bonjour/mDNS,
# so macOS/iOS "Add Printer"/scanning apps and Android find them automatically
# instead of typing an address. IPP advertisement is Windows only (matching
# where the IPP printer itself runs); eSCL works on both OSes. Needs the
# `zeroconf` package (already in requirements.txt) and UDP 5353 open in the
# firewall.
mdns = yes

# AirScan/eSCL: lets macOS "Image Capture", iOS and Android scan directly
# with their own built-in scanning, no app or this web UI needed. Works on
# Windows and Linux — it's the same ScanBackend the web UI's Scan tab uses.
escl = yes
# Which scanner to serve over eSCL; empty = the first one the backend finds
# (fine for the common case of one scanner).
escl_scanner =
# Extra port that serves only the scanner (/eSCL/*). Scanning apps where
# you type just an IP address (e.g. Android's "eSCL Scanner") look for it at
# http://<ip>/eSCL, i.e. port 80, not on the web port above. If the port is
# busy (IIS, another web server) or needs root on Linux, the server says so
# in the log and runs without it. 0 = off.
escl_port = 80
# Require a login for eSCL too (HTTP Basic). Off by default: phones and
# macOS/iOS's built-in scanning can't send a password.
escl_auth = no

# HTTPS for the web UI (port above). Set both to a certificate/key file
# (PEM) to serve HTTPS instead of plain HTTP; leave blank for HTTP, which is
# fine on a trusted home LAN. The IPP port always stays plain HTTP.
ssl_certfile =
ssl_keyfile =

# Where job history and scans are kept (relative paths are from this folder)
data_dir = data
scans_dir = scans

# Login: none = open to everyone on the network | yes = users below must log in
auth = none

# Also require a login for IPP printing (HTTP Basic). Many built-in drivers
# (Windows, phones) can't send a password, so it's off by default.
ipp_auth = no

# How long "remember me" keeps you logged in, days
session_days = 30

[users]
# name = password
# A password can be plain text or a hash made with:
#     python run.py --hash-password          (Windows: .venv\Scripts\python run.py --hash-password)
# admin = change-me

# Names from [users] (one per line, no "= value") who can manage print quotas
# for everyone else, from a panel in the web UI. Everyone else is a regular
# user: they can see their own quota and usage, not set anyone else's.
[admins]
# admin
